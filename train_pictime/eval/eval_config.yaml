# train_pictime/eval/eval_config.yaml

uval:
  # Should contain at least uval.pool_size lines (we'll slice prefixes from it)
  path: train_pictime/val_paths_100K.txt

device: cuda
batch_size: 64

# When we compute embeddings at a large tier, we also compute all "smaller" embedding-based packs
cascade:
  enabled: true

# Iteration frequencies (0 disables)
frequency:
  views_pack: 1000
  rank_pack:  2000
  proto_pack: 2000
  geom_pack:  10000

# Sample sizes per metric pack (prefix lengths from the uval list)
sizes:
  views: 10000
  rank:  20000
  proto: 20000
  geom:  100000

geom:
  ks: [1, 5, 10]
  centered: true   # log raw + centered as variants
  num_pairs: 200000 # more pairs for better stats; can exceed num embeddings

rank:
  centered: true   # log raw + centered as variants


logging:
  prefix: "eval/"