# --- W&B ---
wandb_project: "person-reid-finetune-v2"
experiment_tag: "v18Noblur"             # RUN 1 of the V17 p-sweep. Runs 2/3: "v17blur_p0.75", "v17blur_p1.0"
experiment_group: "production_weights"  # all 3 V17 (face-blur) p-sweep runs share this group

# --- Paths ---
data_base_path: "/data/AI/Tomer/person_reid/dataset_utils/dataset_finetune/Portraits[26]"
reid_store_filename: "reid_store.pkl"      # project-keyed store (built by build_store.py) — replaces reid_index_*.npz
reid_index_filename: "reid_index_v3.npz"   # legacy flat index (load_index); unused by the store path
pretrain_config: "train_pictime/pictime_vitl_im1k_lin834.yaml"
pretrained_weights: "/data/AI/Tomer/dinov3/train_pictime/experiments_V2/V18/ckpt/19750"  # V17 = face-blurred pretrain
output_dir: "/data/AI/Tomer/dinov3/train_pictime/finetune_experiments"

# --- Model ---
backbone_which: "teacher"    # teacher has smoother, higher-quality features (EMA of student)
proj_hidden_dim: 384
proj_output_dim: 128

# --- Freeze modes ---
# Mode A (frozen backbone): freeze_backbone=true, unfreeze_after=0
#   Only the projection head trains. Backbone stays fully frozen.
# Mode C (progressive unfreezing): freeze_backbone=true, unfreeze_after=N
#   Head trains first. At iteration N, the last unfreeze_n_blocks transformer
#   blocks + final layer norm are unfrozen with a lower lr (lr_backbone).
freeze_backbone: true
unfreeze_after: 1000         # iteration to unfreeze (0 = never)
unfreeze_n_blocks: 6         # last N transformer blocks to unfreeze

# --- Training ---
num_epochs: 1                # v3 pool is ~16x bigger (4.9M samples) → 1 epoch is already many iters. VERIFY the "Iters per epoch" print at launch and adjust.
P: 16                        # projects per batch (1 identity each)
K: 4                         # crops per identity -> batch_size = P*K = 64
num_workers: 4
lr: 1.0e-3                   # projection head LR
lr_backbone: 1.0e-4          # unfrozen backbone LR (only used in mode C)
min_lr: 1.0e-6               # final LR after cosine decay
weight_decay: 1.0e-4
warmup_iters: 500            # gradual LR ramp-up to avoid unstable early gradientsi
temperature: 0.07            # SupCon temperature (unused when loss=arcface)
clip_grad: 5.0

# --- Loss ---
loss: "supcon"               # "supcon" (default) | "arcface"
arcface_s: 30                # softmax scale (used when loss=arcface)
arcface_m_deg: 17.2          # angular margin in DEGREES; 17.2° ≈ 0.3 rad (reduced from 28.6° after head-distortion failure)
arcface_margin_warmup_iters: 1000  # ramp margin from 0° to target over first N iters (0 = no warmup)
arcface_classifier_lr: 1.0e-3      # LR for ArcFace classifier param group (defaults to head lr)
arcface_classifier_wd: 0.0         # weight decay on classifier (0 = no WD; cosine-normalized prototypes don't need WD)
seed: 42

# --- Eval ---
val_ratio: 0.008             # ~420 val projects on the v3 pool (~52K projects). 0.05 gave ~2.6K projects /
                             # ~245K crops → eval similarity matrices OOM-killed the process on the 28GB T4
                             # at the first eval (iter 500). 0.008 restores the old (working) eval-pool scale.
silhouette_max_samples: 10000   # cap for stratified silhouette subsample (0 = skip)
# Tiered eval: per-identity restrict val pool to top-T fraction closest to centroid.
# Each tier produces its own mAP/Rank/silhouette (e.g. eval/mAP_top50). Set
# eval_centroid_distances_filename to null to disable tiering and fall back to
# single full-pool eval (legacy behavior).
eval_tiers: [0.5, 0.75, 1.0]
eval_centroid_distances_filename: "crop_distances_v3.json"

# --- Checkpointing ---
ckpt_every: 999             # eval+ckpt cadence. Epoch is ~25K iters → ~25 evals; 500 doubled eval cost for little signal.
ckpt_max_keep: 1             # keep best 3 by eval metric (mAP), not most recent

# --- Curriculum sampler (per-identity centroid-based) ---
# When enabled: at each iter t, the sampler restricts each identity's pool to
# the top fraction p(t) of crops closest to the cluster centroid. p(t) ramps
# linearly from p_start to p_end over the first end_frac * total_iters
# iterations, then stays at p_end. Set p_start=p_end (e.g. both 0.5) for the
# fixed-fraction ablation control. Set p_start=p_end=1.0 (or enabled=false)
# for vanilla sampling.
curriculum:
  enabled: true
  mode: "per_project"          # "per_project" (current) | "ramp" (legacy global p(t))
  # --- per_project mode: static p by labeled-ness (from the store's labeled flags) ---
  p_labeled: 1.0               # reviewer-trusted projects (clusters_fixed) → use all crops
  p_unlabeled: 0.75            # HDBSCAN-labeled projects → top-75% closest to centroid
  # --- ramp mode (legacy; ignored when mode=per_project) ---
  p_start: 1.0
  p_end: 1.0
  end_frac: 0.7
  centroid_distances_filename: "crop_distances_v3.json"  # eval path only; train uses the store's distances

# --- Face blur (Trial 3) ---
# When enabled: Gaussian-blur every face region inside each body crop before
# training. Forces the model to learn body features (clothing, build, posture)
# rather than face features. Eval is never blurred — any train→eval gain is
# body-feature generalization to the unblurred eval distribution.
# Adaptive blur radius = sigma_factor * min(face_w_px, face_h_px) computed in
# original-image pixels (before Resize), so the blur is invariant to image
# resolution and survives the downstream resize.
face_blur:
  enabled: false
  sigma_factor: 0.3
  faces_filename: "faces.json"
